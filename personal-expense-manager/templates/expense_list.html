<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지출 목록</title>

    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

<header>
    <div class="header-inner">

        <h1>개인 지출 관리</h1>

        <nav>
            <a href="dashboard.html">대시보드</a>
            <a href="expense_add.html">지출 등록</a>
            <a href="expense_list.html">지출 목록</a>
        </nav>

    </div>
</header>


<main class="container">

    <div class="page-header">

        <div>
            <h2>지출 목록</h2>
            <p>등록된 지출 내역을 확인합니다.</p>
        </div>

        <a href="expense_add.html" class="button">
            + 지출 등록
        </a>

    </div>


    <form method="GET" action="/expense_list.html">

        <div class="list-toolbar">

            <div>
                <label for="categoryFilter">카테고리</label>

                <select id="categoryFilter" name="category">
                    <option value="">전체</option>
                    <option value="식비">식비</option>
                    <option value="교통">교통</option>
                    <option value="카페">카페</option>
                    <option value="교육비">교육비</option>
                    <option value="놀이비">놀이비</option>
                </select>
            </div>

            <button type="submit" class="button">
                조회
            </button>

        </div>

    </form>

    <section class="panel">

        <div class="panel-header">

            <h3>전체 지출 내역</h3>

            <span class="expense-count">
                총 {{ expenses|length }}건
            </span>

        </div>


        <table>

            <thead>
                <tr>
                    <th>날짜</th>
                    <th>카테고리</th>
                    <th>내용</th>
                    <th class="text-right">금액</th>
                </tr>
            </thead>
            <tbody>

                {% for expense in expenses %}

                <tr>
                    <td>{{ expense[1] }}</td>
                    <td>{{ expense[2] }}</td>
                    <td>{{ expense[3] }}</td>
                    <td class="text-right">
                        {{ "{:,}".format(expense[4]) }}원
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>


        <div class="total-box">

            <span>전체 지출 합계</span>

            <strong>
                <strong>
                    {{ "{:,}".format(total) }}원
                </strong>
            </strong>

        </div>

    </section>

</main>

</body>
</html>
