<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 27px Arial;fill:#111}.s{font:22px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">결제 장애 복구와 대사(Reconciliation)</text><rect x="110" y="150" width="300" height="110" class="b"/><text x="260" y="190" text-anchor="middle" class="h">PG 승인 요청</text><text x="260" y="225" text-anchor="middle" class="s">외부 API 호출</text><line x1="410" y1="205" x2="500" y2="205" class="a"/><rect x="500" y="150" width="300" height="110" class="y"/><text x="650" y="190" text-anchor="middle" class="h">응답 Timeout</text><text x="650" y="225" text-anchor="middle" class="s">성공/실패 알 수 없음</text><line x1="800" y1="205" x2="890" y2="205" class="a"/><rect x="890" y="150" width="300" height="110" class="b"/><text x="1040" y="190" text-anchor="middle" class="h">UNKNOWN 저장</text><text x="1040" y="225" text-anchor="middle" class="s">즉시 실패 처리 금지</text><line x1="1190" y1="205" x2="1280" y2="205" class="a"/><rect x="1280" y="150" width="220" height="110" class="g"/><text x="1390" y="190" text-anchor="middle" class="h">재조회</text><text x="1390" y="225" text-anchor="middle" class="s">PG 상태 확인</text><line x1="1390" y1="260" x2="1390" y2="350" class="a"/><rect x="1180" y="350" width="420" height="130" class="b"/><text x="1390" y="390" text-anchor="middle" class="h">사후 복구 채널</text><text x="1210" y="430" class="s">Webhook · Retry · Batch · 수동재처리</text><line x1="1180" y1="415" x2="1030" y2="415" class="a"/><rect x="650" y="350" width="380" height="130" class="g"/><text x="840" y="390" text-anchor="middle" class="h">내부 DB 보정</text><text x="840" y="430" text-anchor="middle" class="s">DONE / FAIL / CANCELED 확정</text><line x1="650" y1="415" x2="500" y2="415" class="a"/><rect x="100" y="350" width="400" height="130" class="b"/><text x="300" y="390" text-anchor="middle" class="h">정산 대사</text><text x="300" y="430" text-anchor="middle" class="s">우리 DB ↔ PG 거래 ↔ 정산내역</text><rect x="180" y="600" width="1240" height="180" class="y"/><text x="800" y="645" text-anchor="middle" class="h">현업의 핵심</text><text x="230" y="700" class="s">• 외부 시스템과의 일관성은 한 번의 ROLLBACK이 아니라 “최종적으로 맞추는 운영 구조”로 확보한다.</text><text x="230" y="745" class="s">• 그래서 결제 시스템은 API 개발뿐 아니라 로그, 재처리, 모니터링, 배치, 대사까지 포함해야 완성된다.</text></svg>