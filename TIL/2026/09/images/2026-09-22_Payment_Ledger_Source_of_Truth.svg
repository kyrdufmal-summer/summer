<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 25px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:3;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">Payment Ledger와 Source of Truth</text><rect x="100" y="160" width="330" height="130" class="b"/><text x="265" y="205" text-anchor="middle" class="h">orders</text><text x="265" y="240" text-anchor="middle" class="s">고객 주문의 업무 상태</text><text x="265" y="272" text-anchor="middle" class="s">배송·취소·완료</text><line x1="430" y1="225" x2="540" y2="225" class="a"/><rect x="540" y="160" width="330" height="130" class="g"/><text x="705" y="205" text-anchor="middle" class="h">payments</text><text x="705" y="240" text-anchor="middle" class="s">현재 결제 상태의 Projection</text><text x="705" y="272" text-anchor="middle" class="s">DONE / CANCELED 등</text><line x1="870" y1="225" x2="980" y2="225" class="a"/><rect x="980" y="160" width="500" height="130" class="p"/><text x="1230" y="205" text-anchor="middle" class="h">payment_ledger / transactions</text><text x="1230" y="240" text-anchor="middle" class="s">승인·취소·환불·조정 원장</text><text x="1230" y="272" text-anchor="middle" class="s">Append-only에 가깝게 추적</text><rect x="170" y="390" width="1260" height="300" class="b"/><text x="800" y="440" text-anchor="middle" class="h">왜 payments.status 하나로 돈을 관리하면 위험한가?</text><text x="220" y="500" class="s">• 상태를 덮어쓰면 “어떤 거래가 어떤 순서로 발생했는지” 이력이 사라진다.</text><text x="220" y="545" class="s">• 부분취소가 여러 번 발생하면 현재 잔액만 보고 원거래와 취소거래를 대사하기 어렵다.</text><text x="220" y="590" class="s">• 정산·회계·분쟁 대응에는 발생한 금액 이벤트를 재구성할 수 있어야 한다.</text><text x="220" y="635" class="s">• 그래서 현재 상태는 Projection으로 보고, 승인/취소/조정 거래 원장을 별도로 보존하는 설계가 안전하다.</text><text x="800" y="770" text-anchor="middle" class="h">Source of Truth 원칙: “주문 DB”와 “돈의 원장”을 같은 것으로 보지 않는다.</text><text x="800" y="815" text-anchor="middle" class="s">주문은 비즈니스 상태, 결제 원장은 금전 이벤트의 근거. 장애 시 둘을 대사해 최종 상태를 맞춘다.</text></svg>