<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 24px Arial;fill:#111}.s{font:20px Arial;fill:#333}.n{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.r{fill:#fef2f2;stroke:#dc2626;stroke-width:4}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3}.a{stroke:#64748b;stroke-width:3}</style><text x="800" y="55" text-anchor="middle" class="t">관계로 보는 보이스피싱 네트워크: 단일 전화번호가 아니라 연결구조를 본다</text><line x1="800" y1="220" x2="500" y2="360" class="a"/><line x1="800" y1="220" x2="1100" y2="360" class="a"/><line x1="800" y1="220" x2="800" y2="470" class="a"/><line x1="500" y1="360" x2="300" y2="560" class="a"/><line x1="500" y1="360" x2="570" y2="610" class="a"/><line x1="1100" y1="360" x2="1300" y2="560" class="a"/><line x1="1100" y1="360" x2="1030" y2="610" class="a"/><line x1="800" y1="470" x2="800" y2="760" class="a"/><line x1="570" y1="610" x2="800" y2="760" class="a"/><line x1="1030" y1="610" x2="800" y2="760" class="a"/><circle cx="800" cy="220" r="95" class="r"/><text x="800" y="210" text-anchor="middle" class="h">전화번호 X</text><text x="800" y="243" text-anchor="middle" class="s">중심 연결 후보</text><circle cx="500" cy="360" r="75" class="n"/><text x="500" y="353" text-anchor="middle" class="h">Device A</text><circle cx="1100" cy="360" r="75" class="n"/><text x="1100" y="353" text-anchor="middle" class="h">Device B</text><circle cx="800" cy="470" r="75" class="g"/><text x="800" y="463" text-anchor="middle" class="h">계좌 M</text><circle cx="300" cy="560" r="75" class="n"/><text x="300" y="553" text-anchor="middle" class="h">SIM 1</text><circle cx="570" cy="610" r="75" class="g"/><text x="570" y="603" text-anchor="middle" class="h">계좌 N</text><circle cx="1300" cy="560" r="75" class="n"/><text x="1300" y="553" text-anchor="middle" class="h">IP 7</text><circle cx="1030" cy="610" r="75" class="g"/><text x="1030" y="603" text-anchor="middle" class="h">피해자 4</text><circle cx="800" cy="760" r="90" class="g"/><text x="800" y="750" text-anchor="middle" class="h">송금 이벤트</text><text x="800" y="785" text-anchor="middle" class="s">시간·금액·방향</text><text x="800" y="900" text-anchor="middle" class="s">중요: 중심성이 높다고 범죄 리더라는 증거는 아니다. 조사 우선순위를 만드는 단서로 사용한다.</text></svg>