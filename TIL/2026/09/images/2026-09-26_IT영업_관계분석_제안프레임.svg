<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 25px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">IT영업 제안 프레임: DB 제품을 파는 것이 아니라 문제의 관계구조를 판다</text><rect x="90" y="160" width="300" height="120" class="b"/><text x="240" y="202" text-anchor="middle" class="h">1. Business Pain</text><text x="240" y="240" text-anchor="middle" class="s">사기·VOC·운영 누수</text><line x1="390" y1="220" x2="470" y2="220" class="a"/><rect x="470" y="160" width="300" height="120" class="g"/><text x="620" y="202" text-anchor="middle" class="h">2. Hidden Relation</text><text x="620" y="240" text-anchor="middle" class="s">공통기기·계좌·IP·사람</text><line x1="770" y1="220" x2="850" y2="220" class="a"/><rect x="850" y="160" width="300" height="120" class="y"/><text x="1000" y="202" text-anchor="middle" class="h">3. Data Gap</text><text x="1000" y="240" text-anchor="middle" class="s">시스템별 데이터 단절</text><line x1="1150" y1="220" x2="1230" y2="220" class="a"/><rect x="1230" y="160" width="280" height="120" class="g"/><text x="1370" y="202" text-anchor="middle" class="h">4. Action</text><text x="1370" y="240" text-anchor="middle" class="s">Alert·Case·차단·개선</text><rect x="160" y="420" width="1280" height="260" class="b"/><text x="800" y="465" text-anchor="middle" class="h">고객에게 물어볼 Discovery Questions</text><text x="210" y="520" class="s">• 지금은 동일 고객/계좌/기기/전화번호가 여러 시스템에 흩어져 있습니까?</text><text x="210" y="560" class="s">• 한 사건을 조사할 때 몇 개 시스템과 엑셀을 오가야 합니까?</text><text x="210" y="600" class="s">• 반복 VOC나 사고를 “공통 원인 네트워크”로 묶어 본 적이 있습니까?</text><text x="210" y="640" class="s">• Alert 이후 누가 판단하고 어떤 Action을 하며 결과가 다시 데이터에 남습니까?</text><text x="800" y="785" text-anchor="middle" class="h">제안서의 KPI: 조사시간↓ · False Positive↓ · 손실금액↓ · 반복VOC↓ · 자동조치율↑</text></svg>