<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 27px Arial;fill:#111}.s{font:22px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">현업 PG 결제 전체 흐름</text><g><rect x="80" y="150" width="240" height="100" class="b"/><text x="200" y="190" text-anchor="middle" class="h">1. 주문 생성</text><text x="200" y="225" text-anchor="middle" class="s">금액·상품·사용자 확정</text><line x1="320" y1="200" x2="400" y2="200" class="a"/><rect x="400" y="150" width="260" height="100" class="g"/><text x="530" y="190" text-anchor="middle" class="h">2. 내부 DB 저장</text><text x="530" y="225" text-anchor="middle" class="s">짧은 트랜잭션 COMMIT</text><line x1="660" y1="200" x2="740" y2="200" class="a"/><rect x="740" y="150" width="260" height="100" class="b"/><text x="870" y="190" text-anchor="middle" class="h">3. PG 인증/승인</text><text x="870" y="225" text-anchor="middle" class="s">외부 네트워크 호출</text><line x1="1000" y1="200" x2="1080" y2="200" class="a"/><rect x="1080" y="150" width="300" height="100" class="y"/><text x="1230" y="190" text-anchor="middle" class="h">4. 결과 수신</text><text x="1230" y="225" text-anchor="middle" class="s">SUCCESS / FAIL / UNKNOWN</text><line x1="1230" y1="250" x2="1230" y2="340" class="a"/><rect x="1080" y="340" width="300" height="110" class="g"/><text x="1230" y="380" text-anchor="middle" class="h">5. 상태 반영</text><text x="1230" y="415" text-anchor="middle" class="s">payments / orders 업데이트</text><line x1="1080" y1="395" x2="960" y2="395" class="a"/><rect x="680" y="340" width="280" height="110" class="b"/><text x="820" y="380" text-anchor="middle" class="h">6. 후속 처리</text><text x="820" y="415" text-anchor="middle" class="s">재고·포인트·알림·배송</text><line x1="680" y1="395" x2="560" y2="395" class="a"/><rect x="220" y="340" width="340" height="110" class="y"/><text x="390" y="380" text-anchor="middle" class="h">7. 운영 보정</text><text x="390" y="415" text-anchor="middle" class="s">Webhook·Retry·조회·대사</text></g><rect x="130" y="560" width="1340" height="210" class="b"/><text x="800" y="610" text-anchor="middle" class="h">왜 이렇게 나누는가?</text><text x="190" y="665" class="s">• DB 트랜잭션은 짧게 유지해 Lock·Connection 점유를 줄인다.</text><text x="190" y="705" class="s">• PG는 외부 시스템이라 Timeout·응답 유실이 가능하므로 별도 상태 관리가 필요하다.</text><text x="190" y="745" class="s">• 결제는 즉시 성공/실패만 있는 것이 아니라 UNKNOWN 상태와 사후 보정이 존재한다.</text></svg>