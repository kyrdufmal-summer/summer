<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 27px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">관계형 DB와 Graph DB: 경쟁이 아니라 역할 분담</text><rect x="90" y="150" width="620" height="530" class="b"/><text x="400" y="200" text-anchor="middle" class="h">RDBMS / PostgreSQL</text><text x="140" y="260" class="s">강점</text><text x="160" y="305" class="s">• 거래·주문·회원처럼 정형 업무 처리</text><text x="160" y="345" class="s">• ACID Transaction / Constraint</text><text x="160" y="385" class="s">• 집계·정산·리포트</text><text x="140" y="455" class="s">관계 탐색</text><text x="160" y="500" class="s">• JOIN으로 가능</text><text x="160" y="540" class="s">• 관계 깊이가 늘수록 Query가 복잡</text><text x="160" y="580" class="s">• N-hop 탐색은 재귀 CTE 등이 필요</text><rect x="890" y="150" width="620" height="530" class="g"/><text x="1200" y="200" text-anchor="middle" class="h">Graph / Ontology Layer</text><text x="940" y="260" class="s">강점</text><text x="960" y="305" class="s">• 사람–기기–계좌–IP–이벤트 연결 탐색</text><text x="960" y="345" class="s">• N-hop / Path / Community 분석</text><text x="960" y="385" class="s">• 숨은 공통자원·조직적 패턴 탐지</text><text x="940" y="455" class="s">운영 활용</text><text x="960" y="500" class="s">• 조사 화면 / Alert / Case Management</text><text x="960" y="540" class="s">• 중심성·커뮤니티·관계 Risk Score</text><text x="960" y="580" class="s">• 객체와 관계를 업무 언어로 표현</text><line x1="710" y1="420" x2="890" y2="420" class="a"/><text x="800" y="760" text-anchor="middle" class="h">실무 권장: Transaction System은 RDBMS, Relationship Intelligence는 Graph/Ontology로 보강</text><text x="800" y="815" text-anchor="middle" class="s">ETL/CDC로 핵심 Entity·Event를 연결하되 원천 DB의 정합성 기준은 유지한다.</text></svg>