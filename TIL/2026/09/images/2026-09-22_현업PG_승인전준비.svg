<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 27px Arial;fill:#111}.s{font:22px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.c{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">PG 연동 전에 먼저 승인·확정해야 할 것</text><g><rect x="90" y="140" width="300" height="140" class="c"/><text x="240" y="180" text-anchor="middle" class="h">사업/정책</text><text x="120" y="220" class="s">• 취소 가능 시점</text><text x="120" y="255" class="s">• 부분취소 여부</text><line x1="390" y1="210" x2="470" y2="210" class="a"/><rect x="470" y="140" width="300" height="140" class="b"/><text x="620" y="180" text-anchor="middle" class="h">PG 계약/심사</text><text x="500" y="220" class="s">• MID / 운영키</text><text x="500" y="255" class="s">• 결제수단 활성화</text><line x1="770" y1="210" x2="850" y2="210" class="a"/><rect x="850" y="140" width="300" height="140" class="c"/><text x="1000" y="180" text-anchor="middle" class="h">정산/회계</text><text x="880" y="220" class="s">• 수수료·정산주기</text><text x="880" y="255" class="s">• 과세/면세</text><line x1="1150" y1="210" x2="1230" y2="210" class="a"/><rect x="1230" y="140" width="280" height="140" class="b"/><text x="1370" y="180" text-anchor="middle" class="h">운영권한</text><text x="1260" y="220" class="s">• 취소 권한</text><text x="1260" y="255" class="s">• 관리자 승인</text></g><rect x="180" y="390" width="1240" height="300" class="b"/><text x="800" y="440" text-anchor="middle" class="h">미리 결정하지 않으면 개발 중 다시 뜯어고치게 되는 항목</text><text x="230" y="500" class="s">• 카드 / 계좌이체 / 가상계좌 / 간편결제 중 어떤 수단을 제공할지</text><text x="230" y="545" class="s">• 전액취소만 허용할지, 부분취소를 허용할지</text><text x="230" y="590" class="s">• 사용자 환불 요청 후 자동취소인지, 운영자 승인 후 취소인지</text><text x="230" y="635" class="s">• 가상계좌 입금 후 환불계좌를 어떻게 수집·검증할지</text><text x="230" y="680" class="s">• 정기결제/에스크로/해외결제 등 별도 심사 기능을 사용할지</text><text x="800" y="790" text-anchor="middle" class="h">결론: 결제 개발은 API 연동보다 정책·계약·운영 기준 확정이 먼저다.</text></svg>