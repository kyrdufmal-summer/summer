<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 25px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">분산 결제 처리: Saga · Outbox · At-least-once · DLQ</text><rect x="90" y="150" width="280" height="110" class="p"/><text x="230" y="192" text-anchor="middle" class="h">Order DB</text><text x="230" y="227" text-anchor="middle" class="s">주문 상태 COMMIT</text><line x1="370" y1="205" x2="470" y2="205" class="a"/><rect x="470" y="150" width="280" height="110" class="g"/><text x="610" y="192" text-anchor="middle" class="h">Outbox</text><text x="610" y="227" text-anchor="middle" class="s">이벤트를 같은 DB에 기록</text><line x1="750" y1="205" x2="850" y2="205" class="a"/><rect x="850" y="150" width="280" height="110" class="b"/><text x="990" y="192" text-anchor="middle" class="h">Message Queue</text><text x="990" y="227" text-anchor="middle" class="s">At-least-once 전달</text><line x1="1130" y1="205" x2="1230" y2="205" class="a"/><rect x="1230" y="150" width="280" height="110" class="p"/><text x="1370" y="192" text-anchor="middle" class="h">Payment Worker</text><text x="1370" y="227" text-anchor="middle" class="s">PG 호출 / 상태 반영</text><line x1="1370" y1="260" x2="1370" y2="350" class="a"/><rect x="1190" y="350" width="360" height="120" class="y"/><text x="1370" y="390" text-anchor="middle" class="h">실패 / 재시도</text><text x="1370" y="425" text-anchor="middle" class="s">Idempotency로 중복 방지</text><line x1="1190" y1="410" x2="1060" y2="410" class="a"/><rect x="720" y="350" width="340" height="120" class="b"/><text x="890" y="390" text-anchor="middle" class="h">Retry Policy</text><text x="890" y="425" text-anchor="middle" class="s">Backoff / 횟수 제한</text><line x1="720" y1="410" x2="590" y2="410" class="a"/><rect x="230" y="350" width="360" height="120" class="y"/><text x="410" y="390" text-anchor="middle" class="h">DLQ</text><text x="410" y="425" text-anchor="middle" class="s">계속 실패한 메시지 격리</text><rect x="150" y="590" width="1300" height="220" class="g"/><text x="800" y="640" text-anchor="middle" class="h">Saga / Compensation의 핵심</text><text x="210" y="700" class="s">• 분산 시스템에서는 하나의 글로벌 ROLLBACK 대신 각 단계의 로컬 트랜잭션을 수행한다.</text><text x="210" y="745" class="s">• 중간 단계가 실패하면 “이전 행동을 되돌리는 보상 트랜잭션”을 실행한다. 예: 재고 복구, 쿠폰 복원, PG 취소.</text><text x="210" y="790" class="s">• Exactly-once를 보장하기 어렵기 때문에, At-least-once + Idempotency + Ledger로 “한 번 처리된 것처럼” 만든다.</text><text x="800" y="875" text-anchor="middle" class="h">운영 관점에서는 DLQ·Retry Queue·미처리 건수·보상 실패 건을 반드시 모니터링한다.</text></svg>