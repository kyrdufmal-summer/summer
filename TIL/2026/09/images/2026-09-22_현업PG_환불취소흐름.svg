<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 27px Arial;fill:#111}.s{font:22px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.r{fill:#fef2f2;stroke:#dc2626;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">현업 환불·취소 처리 흐름</text><rect x="100" y="150" width="260" height="100" class="b"/><text x="230" y="190" text-anchor="middle" class="h">환불 요청</text><text x="230" y="225" text-anchor="middle" class="s">사용자 / 운영자</text><line x1="360" y1="200" x2="440" y2="200" class="a"/><rect x="440" y="150" width="300" height="100" class="g"/><text x="590" y="190" text-anchor="middle" class="h">정책 검증</text><text x="590" y="225" text-anchor="middle" class="s">가능시점·금액·배송상태</text><line x1="740" y1="200" x2="820" y2="200" class="a"/><rect x="820" y="150" width="300" height="100" class="b"/><text x="970" y="190" text-anchor="middle" class="h">PG 취소 API</text><text x="970" y="225" text-anchor="middle" class="s">전액 / 부분취소</text><line x1="1120" y1="200" x2="1200" y2="200" class="a"/><rect x="1200" y="150" width="300" height="100" class="r"/><text x="1350" y="190" text-anchor="middle" class="h">결과 확인</text><text x="1350" y="225" text-anchor="middle" class="s">SUCCESS / UNKNOWN</text><line x1="1350" y1="250" x2="1350" y2="350" class="a"/><rect x="1160" y="350" width="380" height="120" class="g"/><text x="1350" y="390" text-anchor="middle" class="h">DB 반영</text><text x="1350" y="425" text-anchor="middle" class="s">누적취소액·잔액·상태</text><line x1="1160" y1="410" x2="1030" y2="410" class="a"/><rect x="690" y="350" width="340" height="120" class="b"/><text x="860" y="390" text-anchor="middle" class="h">환불 완료 대기</text><text x="860" y="425" text-anchor="middle" class="s">카드사/은행 반영 시간 존재</text><line x1="690" y1="410" x2="560" y2="410" class="a"/><rect x="160" y="350" width="400" height="120" class="r"/><text x="360" y="390" text-anchor="middle" class="h">UNKNOWN / 장애</text><text x="360" y="425" text-anchor="middle" class="s">조회·Retry·Webhook·대사</text><rect x="160" y="590" width="1280" height="190" class="b"/><text x="800" y="635" text-anchor="middle" class="h">왜 환불도 별도 상태가 필요한가?</text><text x="210" y="690" class="s">• “취소 API 성공”과 “사용자 계좌/카드에 실제 환불 반영” 시점은 다를 수 있다.</text><text x="210" y="730" class="s">• 부분취소는 여러 번 발생할 수 있으므로 원금·누적취소액·잔액을 분리 관리해야 한다.</text><text x="210" y="770" class="s">• PG 취소 성공 후 DB 저장 실패 같은 역전 상황을 사후 대사로 복구해야 한다.</text></svg>