<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
    .title{font:700 44px Arial, sans-serif; fill:#111827}
    .sub{font:700 28px Arial, sans-serif; fill:#111827}
    .txt{font:24px Arial, sans-serif; fill:#1f2937}
    .small{font:21px Arial, sans-serif; fill:#374151}
    .box{fill:#f9fafb;stroke:#111827;stroke-width:2;rx:20;ry:20}
    .learn{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:24;ry:24}
    .real{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:24;ry:24}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:20;ry:20}
    .arrow{stroke:#4b5563;stroke-width:4;marker-end:url(#a)}
    .dashed{stroke:#9ca3af;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/></marker></defs>

  <text x="800" y="65" text-anchor="middle" class="title">PostgreSQL 트랜잭션 학습 vs 현업 PG 결제 처리</text>

  <rect x="70" y="120" width="670" height="770" class="learn"/>
  <text x="405" y="170" text-anchor="middle" class="sub">학습용 구조</text>
  <text x="405" y="210" text-anchor="middle" class="small">BEGIN / COMMIT / ROLLBACK 개념을 명확히 익히기</text>

  <rect x="190" y="270" width="430" height="90" class="box"/>
  <text x="405" y="325" text-anchor="middle" class="txt">BEGIN</text>
  <line x1="405" y1="360" x2="405" y2="420" class="arrow"/>

  <rect x="190" y="420" width="430" height="110" class="box"/>
  <text x="405" y="465" text-anchor="middle" class="txt">INSERT / UPDATE</text>
  <text x="405" y="500" text-anchor="middle" class="small">DB 내부 임시 변경</text>
  <line x1="405" y1="530" x2="405" y2="590" class="arrow"/>

  <rect x="145" y="590" width="520" height="110" class="warn"/>
  <text x="405" y="635" text-anchor="middle" class="txt">업무 결과 판단</text>
  <text x="405" y="670" text-anchor="middle" class="small">성공이면 확정 / 실패면 취소</text>

  <line x1="300" y1="700" x2="220" y2="770" class="arrow"/>
  <line x1="510" y1="700" x2="590" y2="770" class="arrow"/>
  <rect x="100" y="770" width="260" height="90" class="box"/>
  <text x="230" y="825" text-anchor="middle" class="txt">COMMIT</text>
  <rect x="450" y="770" width="260" height="90" class="box"/>
  <text x="580" y="825" text-anchor="middle" class="txt">ROLLBACK</text>

  <rect x="860" y="120" width="670" height="770" class="real"/>
  <text x="1195" y="170" text-anchor="middle" class="sub">현업 결제 처리</text>
  <text x="1195" y="210" text-anchor="middle" class="small">DB와 PG를 하나의 긴 트랜잭션으로 묶지 않음</text>

  <rect x="980" y="260" width="430" height="95" class="box"/>
  <text x="1195" y="305" text-anchor="middle" class="txt">내부 DB 짧은 트랜잭션</text>
  <text x="1195" y="338" text-anchor="middle" class="small">주문/결제 상태 저장</text>

  <line x1="1195" y1="355" x2="1195" y2="410" class="arrow"/>
  <rect x="980" y="410" width="430" height="95" class="box"/>
  <text x="1195" y="455" text-anchor="middle" class="txt">외부 PG API 호출</text>
  <text x="1195" y="488" text-anchor="middle" class="small">네트워크 · 응답 유실 가능</text>

  <line x1="1195" y1="505" x2="1195" y2="565" class="arrow"/>
  <rect x="930" y="565" width="530" height="125" class="warn"/>
  <text x="1195" y="610" text-anchor="middle" class="txt">SUCCESS / FAIL / UNKNOWN</text>
  <text x="1195" y="647" text-anchor="middle" class="small">UNKNOWN을 즉시 실패로 단정하지 않음</text>
  <text x="1195" y="678" text-anchor="middle" class="small">상태 플래그를 남겨 후속 처리</text>

  <line x1="1195" y1="690" x2="1195" y2="745" class="arrow"/>
  <rect x="900" y="745" width="590" height="110" class="box"/>
  <text x="1195" y="790" text-anchor="middle" class="txt">Webhook · 재조회 · Retry · 배치 · 대사</text>
  <text x="1195" y="825" text-anchor="middle" class="small">필요 시 내부 DB 보정 / PG 취소 API 호출</text>

  <text x="800" y="940" text-anchor="middle" class="small">정민님: 내부 처리는 DB 트랜잭션, 외부 PG는 별도 처리 · 교수님: 미확정 건은 재조회/배치/대사로 최종 정합성 확보</text>
</svg>