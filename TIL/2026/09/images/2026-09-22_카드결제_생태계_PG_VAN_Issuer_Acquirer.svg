<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 26px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.p{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">카드 결제 생태계: 승인정보와 돈은 여러 주체를 거친다</text><rect x="60" y="180" width="220" height="100" class="p"/><text x="170" y="220" text-anchor="middle" class="h">고객</text><text x="170" y="255" text-anchor="middle" class="s">Cardholder</text><line x1="280" y1="230" x2="360" y2="230" class="a"/><rect x="360" y="180" width="240" height="100" class="b"/><text x="480" y="220" text-anchor="middle" class="h">Merchant</text><text x="480" y="255" text-anchor="middle" class="s">쇼핑몰 / 서비스</text><line x1="600" y1="230" x2="680" y2="230" class="a"/><rect x="680" y="180" width="220" height="100" class="g"/><text x="790" y="220" text-anchor="middle" class="h">PG</text><text x="790" y="255" text-anchor="middle" class="s">결제 연동 / 정산창구</text><line x1="900" y1="230" x2="980" y2="230" class="a"/><rect x="980" y="180" width="220" height="100" class="b"/><text x="1090" y="220" text-anchor="middle" class="h">VAN / 결제망</text><text x="1090" y="255" text-anchor="middle" class="s">메시지 중계</text><line x1="1200" y1="230" x2="1280" y2="230" class="a"/><rect x="1280" y="180" width="240" height="100" class="p"/><text x="1400" y="220" text-anchor="middle" class="h">카드사/은행</text><text x="1400" y="255" text-anchor="middle" class="s">Issuer / Acquirer 영역</text><rect x="180" y="420" width="1240" height="260" class="b"/><text x="800" y="465" text-anchor="middle" class="h">개념적으로 구분해야 할 역할</text><text x="230" y="520" class="s">• Issuer: 고객에게 카드를 발급하고 승인·한도·청구를 관리하는 발급사.</text><text x="230" y="565" class="s">• Acquirer: 가맹점 쪽에서 카드 거래를 받아 결제망과 연결하고 매입·정산 관계를 담당하는 영역.</text><text x="230" y="610" class="s">• Card Network: Visa/Mastercard 등 카드 네트워크. 국내 구조는 계약 및 망 구성에 따라 역할 분담이 달라질 수 있다.</text><text x="230" y="655" class="s">• PG/VAN: Merchant가 개별 금융사와 직접 붙지 않도록 결제창·API·중계·정산 편의를 제공한다.</text><text x="800" y="780" text-anchor="middle" class="h">운영자는 “승인번호 하나”가 아니라 어느 주체에서 어떤 상태인지 구분해서 봐야 한다.</text></svg>