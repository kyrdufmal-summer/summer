<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 24px Arial;fill:#111}.s{font:20px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">관계 데이터 분석이 실제 운영 Action으로 가는 흐름</text><rect x="60" y="170" width="250" height="110" class="b"/><text x="185" y="210" text-anchor="middle" class="h">Data Sources</text><text x="185" y="245" text-anchor="middle" class="s">CRM·Call·Payment·VOC</text><line x1="310" y1="225" x2="380" y2="225" class="a"/><rect x="380" y="170" width="250" height="110" class="g"/><text x="505" y="210" text-anchor="middle" class="h">Entity Resolution</text><text x="505" y="245" text-anchor="middle" class="s">동일인/동일기기 식별</text><line x1="630" y1="225" x2="700" y2="225" class="a"/><rect x="700" y="170" width="250" height="110" class="b"/><text x="825" y="210" text-anchor="middle" class="h">Graph Build</text><text x="825" y="245" text-anchor="middle" class="s">Object + Link + Event</text><line x1="950" y1="225" x2="1020" y2="225" class="a"/><rect x="1020" y="170" width="250" height="110" class="y"/><text x="1145" y="210" text-anchor="middle" class="h">Analytics</text><text x="1145" y="245" text-anchor="middle" class="s">Centrality·Community</text><line x1="1270" y1="225" x2="1340" y2="225" class="a"/><rect x="1340" y="170" width="210" height="110" class="g"/><text x="1445" y="210" text-anchor="middle" class="h">Alert</text><text x="1445" y="245" text-anchor="middle" class="s">Priority Queue</text><line x1="1445" y1="280" x2="1445" y2="390" class="a"/><rect x="1260" y="390" width="290" height="110" class="b"/><text x="1405" y="430" text-anchor="middle" class="h">Investigation</text><text x="1405" y="465" text-anchor="middle" class="s">증거 확인·Case 생성</text><line x1="1260" y1="445" x2="1150" y2="445" class="a"/><rect x="860" y="390" width="290" height="110" class="g"/><text x="1005" y="430" text-anchor="middle" class="h">Action</text><text x="1005" y="465" text-anchor="middle" class="s">차단·추가인증·상담</text><line x1="860" y1="445" x2="750" y2="445" class="a"/><rect x="450" y="390" width="300" height="110" class="y"/><text x="600" y="430" text-anchor="middle" class="h">Feedback</text><text x="600" y="465" text-anchor="middle" class="s">True/False Positive 기록</text><line x1="450" y1="445" x2="340" y2="445" class="a"/><rect x="70" y="390" width="270" height="110" class="b"/><text x="205" y="430" text-anchor="middle" class="h">Model / Rule 개선</text><text x="205" y="465" text-anchor="middle" class="s">VOC·조사 결과 재학습</text><rect x="190" y="650" width="1220" height="120" class="g"/><text x="800" y="695" text-anchor="middle" class="h">핵심: 분석 결과를 예쁜 그래프로 끝내지 않고 운영자의 의사결정과 Write-back까지 닫아야 한다.</text><text x="800" y="735" text-anchor="middle" class="s">Palantir의 Ontology도 Object·Relation·Action을 연결해 분석을 실제 업무 Action으로 이어가는 접근을 강조한다.</text></svg>