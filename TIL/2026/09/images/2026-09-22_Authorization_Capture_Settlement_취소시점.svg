<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 42px Arial;fill:#111}.h{font:700 25px Arial;fill:#111}.s{font:21px Arial;fill:#333}.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.g{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:18}.y{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:18}.a{stroke:#475569;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#475569"/></marker></defs><text x="800" y="60" text-anchor="middle" class="t">카드 거래 Lifecycle: Authorization → Capture → Settlement</text><rect x="80" y="170" width="280" height="110" class="g"/><text x="220" y="212" text-anchor="middle" class="h">Authorization</text><text x="220" y="247" text-anchor="middle" class="s">승인 / 한도 확보</text><line x1="360" y1="225" x2="460" y2="225" class="a"/><rect x="460" y="170" width="280" height="110" class="b"/><text x="600" y="212" text-anchor="middle" class="h">Capture / 매입</text><text x="600" y="247" text-anchor="middle" class="s">매출 확정 단계</text><line x1="740" y1="225" x2="840" y2="225" class="a"/><rect x="840" y="170" width="280" height="110" class="g"/><text x="980" y="212" text-anchor="middle" class="h">Clearing</text><text x="980" y="247" text-anchor="middle" class="s">거래자료 정리/교환</text><line x1="1120" y1="225" x2="1220" y2="225" class="a"/><rect x="1220" y="170" width="280" height="110" class="b"/><text x="1360" y="212" text-anchor="middle" class="h">Settlement</text><text x="1360" y="247" text-anchor="middle" class="s">가맹점 정산</text><rect x="150" y="390" width="1300" height="330" class="y"/><text x="800" y="440" text-anchor="middle" class="h">취소 시점에 따라 업무 의미가 달라진다</text><text x="210" y="500" class="s">• 승인 후 매입 전 취소: 승인 해제 성격이 강하다. 가맹점 매출로 확정되기 전 단계.</text><text x="210" y="550" class="s">• 매입 후 취소: 이미 매출 흐름에 들어간 거래를 반대로 정리해야 하므로 카드사/PG 처리시간이 개입한다.</text><text x="210" y="600" class="s">• 부분취소: 원거래를 유지하면서 별도의 취소 거래가 누적된다. 원승인번호/거래키/취소키 추적이 중요하다.</text><text x="210" y="650" class="s">• 정산 후 취소: 다음 정산에서 상계되거나 별도 조정이 발생할 수 있어 재무·정산 관점의 추적이 필요하다.</text><text x="800" y="800" text-anchor="middle" class="h">그래서 “결제완료” 하나의 상태만으로는 금융 거래의 전체 생명주기를 표현할 수 없다.</text></svg>